name = "nourish-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[[d1_databases]]
binding = "DB"
database_name = "nourish-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "http://localhost:5173"

[triggers]
crons = ["0 8 * * *", "0 16 * * *"]
